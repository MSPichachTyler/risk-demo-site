<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copilot Risk Assistant — Microsoft Copilot Studio</title>
  <style>
    :root {
      --cs-bg: #faf9f8;
      --cs-surface: #ffffff;
      --cs-surface-2: #f5f5f5;
      --cs-border: #e1dfdd;
      --cs-border-strong: #c8c6c4;
      --cs-text: #242424;
      --cs-text-muted: #605e5c;
      --cs-text-soft: #8a8886;
      --cs-accent: #0078d4;
      --cs-accent-hover: #106ebe;
      --cs-accent-soft: #deecf9;
      --cs-purple: #5b5fc7;
      --cs-teal: #117865;
      --cs-teal-soft: #d6f3ec;
      --cs-green: #107c10;
      --cs-amber: #b07a07;
      --cs-red: #c50f1f;
      --cs-shadow: 0 1.6px 3.6px rgba(0,0,0,0.10), 0 0.3px 0.9px rgba(0,0,0,0.07);
      --cs-shadow-strong: 0 6.4px 14.4px rgba(0,0,0,0.13), 0 1.2px 3.6px rgba(0,0,0,0.10);
      --cs-radius: 8px;
      --cs-radius-sm: 4px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "Segoe UI Web (West European)", "Segoe UI", -apple-system,
                   BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
      font-size: 14px;
      color: var(--cs-text);
      background: var(--cs-bg);
      overflow: hidden;
    }
    a { color: var(--cs-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      font: inherit; cursor: pointer; border: 1px solid transparent; border-radius: var(--cs-radius-sm);
      padding: 6px 12px; background: transparent; color: var(--cs-text);
      display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover { background: var(--cs-surface-2); }
    .btn-primary {
      background: var(--cs-accent); color: #fff; border-color: var(--cs-accent);
      padding: 6px 16px; font-weight: 600;
    }
    .btn-primary:hover { background: var(--cs-accent-hover); border-color: var(--cs-accent-hover); }
    .btn-outline {
      background: var(--cs-surface); color: var(--cs-text); border-color: var(--cs-border-strong);
    }
    .btn-outline:hover { background: var(--cs-surface-2); }
    .btn-ghost { color: var(--cs-text-muted); padding: 6px 8px; }
    .btn-disabled { opacity: 0.5; cursor: not-allowed; background: var(--cs-surface-2); }

    /* ---------- App shell (Copilot Studio chrome) ---------- */
    .app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }

    /* Top brand bar */
    .top-bar {
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 4px 0 0;
      gap: 8px;
      height: 48px;
    }
    .waffle {
      width: 48px; height: 48px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; background: transparent; border: none; cursor: pointer;
    }
    .waffle:hover { background: rgba(255,255,255,.08); }
    .ms-logo {
      display: inline-flex; align-items: center; gap: 8px; padding: 0 6px 0 4px;
    }
    .ms-logo .ms-grid {
      display: grid; grid-template-columns: 9px 9px; grid-template-rows: 9px 9px; gap: 1.5px;
    }
    .ms-logo .ms-grid div { width: 9px; height: 9px; }
    .ms-logo .ms-grid div:nth-child(1){ background:#f25022; }
    .ms-logo .ms-grid div:nth-child(2){ background:#7fba00; }
    .ms-logo .ms-grid div:nth-child(3){ background:#00a4ef; }
    .ms-logo .ms-grid div:nth-child(4){ background:#ffb900; }
    .ms-logo .ms-name { font-size: 15px; color: #fff; font-weight: 600; }
    .product-name { color: #fff; font-size: 15px; padding-left: 4px; font-weight: 600; }
    .top-spacer { flex: 1; }
    .top-actions { display: flex; align-items: center; gap: 4px; padding-right: 8px; }
    .env-pill {
      color: #fff; padding: 4px 10px; display: flex; flex-direction: column; line-height: 1.1;
      font-size: 11px;
    }
    .env-pill .env-label { color: #c8c6c4; font-size: 10px; }
    .top-icon-btn {
      width: 40px; height: 40px; border-radius: 50%; color: #fff; display: inline-flex;
      align-items: center; justify-content: center; background: transparent; border: none;
      cursor: pointer;
    }
    .top-icon-btn:hover { background: rgba(255,255,255,.08); }
    .top-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: #c19c5b;
      color: #fff; display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; margin-left: 4px;
    }

    /* Body: left rail + main */
    .body { display: grid; grid-template-columns: 56px 1fr; min-height: 0; }
    .left-rail {
      background: #fafafa;
      border-right: 1px solid var(--cs-border);
      display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px;
    }
    .rail-btn {
      width: 48px; height: 48px; display: inline-flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      background: transparent; border: none; color: var(--cs-text);
      font-size: 9px; padding: 2px; border-radius: 4px; cursor: pointer;
      position: relative;
    }
    .rail-btn:hover { background: var(--cs-surface-2); }
    .rail-btn.active { color: var(--cs-purple); font-weight: 600; }
    .rail-btn.active::before {
      content: ''; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px;
      background: var(--cs-purple); border-radius: 0 3px 3px 0;
    }
    .rail-icon { font-size: 16px; line-height: 1; }
    .rail-label { font-size: 9px; }

    /* Main canvas */
    .main {
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
      background: var(--cs-bg); overflow: hidden;
    }

    /* Sub-header (agent name + tabs + actions) */
    .sub-header {
      background: var(--cs-bg);
      border-bottom: 1px solid var(--cs-border);
      display: flex; align-items: center; gap: 12px;
      padding: 6px 18px 0 18px; flex-shrink: 0;
    }
    .agent-id { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .agent-icon {
      width: 32px; height: 32px; border-radius: 6px;
      background: linear-gradient(135deg, var(--cs-teal) 0%, #43b7a3 100%);
      color: #fff; display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .agent-title { font-size: 14px; font-weight: 600; }
    .lock-icon { color: var(--cs-text-soft); font-size: 11px; }
    .tabs { display: flex; align-items: stretch; gap: 0; }
    .tab {
      padding: 12px 14px; font-size: 13px; color: var(--cs-text-muted);
      border-bottom: 2px solid transparent; cursor: pointer; user-select: none;
    }
    .tab:hover { color: var(--cs-text); }
    .tab.active { color: var(--cs-text); border-bottom-color: var(--cs-accent); font-weight: 600; }
    .sub-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; padding-bottom: 6px; }
    .test-btn { border: 1px solid var(--cs-accent); color: var(--cs-accent); background: var(--cs-accent-soft); }
    .test-btn:hover { background: #cae5fa; }

    /* Banner */
    .banner {
      background: #fff4f4; border-bottom: 1px solid #f3d6d6;
      padding: 10px 18px; font-size: 13px; color: var(--cs-text);
      display: flex; align-items: center; gap: 10px;
    }
    .banner-x { color: var(--cs-red); font-size: 16px; }

    /* Content area */
    .content { flex: 1; min-height: 0; min-width: 0; overflow: auto; padding: 16px; }

    /* ========== Home view ========== */
    .home-hero {
      background: linear-gradient(135deg, #f3f0fa 0%, #e7f3fc 100%);
      border: 1px solid var(--cs-border); border-radius: 12px; padding: 24px 28px;
      margin-bottom: 16px;
    }
    .home-hero h1 { margin: 0 0 6px 0; font-size: 22px; font-weight: 600; }
    .home-hero p { margin: 0; color: var(--cs-text-muted); max-width: 80ch; }
    .roi-strip {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px;
    }
    .roi-tile {
      background: var(--cs-surface); border: 1px solid var(--cs-border); border-radius: 8px;
      padding: 12px 14px; box-shadow: var(--cs-shadow);
    }
    .roi-tile .lbl { font-size: 11px; color: var(--cs-text-muted); text-transform: uppercase; letter-spacing: .04em; }
    .roi-tile .val { font-size: 22px; font-weight: 600; color: var(--cs-purple); margin-top: 4px; }
    .roi-tile .sub { font-size: 11px; color: var(--cs-text-soft); margin-top: 2px; }

    .section-title { font-size: 16px; font-weight: 600; margin: 16px 0 10px 0; }
    .demo-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .demo-card {
      background: var(--cs-surface); border: 1px solid var(--cs-border); border-radius: 10px;
      padding: 16px; cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s;
      display: flex; flex-direction: column; gap: 8px; min-height: 220px;
    }
    .demo-card:hover { box-shadow: var(--cs-shadow-strong); border-color: var(--cs-accent); transform: translateY(-1px); }
    .demo-card .card-head { display: flex; align-items: center; gap: 10px; }
    .demo-card .card-icon {
      width: 36px; height: 36px; border-radius: 8px; background: var(--cs-teal-soft);
      display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .demo-card .card-num { font-size: 11px; color: var(--cs-text-muted); }
    .demo-card .card-title { font-size: 15px; font-weight: 600; margin: 0; }
    .demo-card .card-domain {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px;
      background: var(--cs-accent-soft); color: var(--cs-accent);
    }
    .demo-card p { margin: 0; color: var(--cs-text-muted); font-size: 13px; line-height: 1.5; }
    .demo-card .card-roi {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      padding-top: 8px; border-top: 1px dashed var(--cs-border); margin-top: auto;
    }
    .demo-card .roi-line .lbl { font-size: 10px; color: var(--cs-text-muted); text-transform: uppercase; }
    .demo-card .roi-line .val { font-size: 13px; font-weight: 600; color: var(--cs-purple); }

    /* ========== Demo runner ========== */
    .demo-runner {
      display: grid; grid-template-columns: minmax(360px, 420px) 1fr; gap: 16px;
      min-height: calc(100vh - 48px - 90px);
    }
    .panel {
      background: var(--cs-surface); border: 1px solid var(--cs-border); border-radius: 10px;
      box-shadow: var(--cs-shadow);
    }
    /* Left: chat */
    .left-col {
      display: flex; flex-direction: column; gap: 12px;
      min-width: 0; min-height: 0;
      max-height: calc(100vh - 152px);
    }
    .left-col .process-card { flex: 0 0 auto; }
    .chat-panel { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    .chat-header {
      padding: 14px 16px; border-bottom: 1px solid var(--cs-border);
      display: flex; align-items: center; gap: 10px;
    }
    .chat-avatar {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #0099ff 0%, #5b5fc7 100%);
      color: #fff; display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700;
    }
    .chat-title { font-size: 14px; font-weight: 600; }
    .chat-sub { font-size: 11px; color: var(--cs-text-muted); }
    .chat-status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--cs-green); }
    .chat-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cs-green); }

    .chat-body {
      flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      background: linear-gradient(180deg, #fcfcfd 0%, #f7f7f9 100%);
    }
    .chat-msg { display: flex; gap: 8px; align-items: flex-start; max-width: 92%; }
    .chat-msg.bot { align-self: flex-start; }
    .chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .chat-msg.bot .msg-avatar { background: linear-gradient(135deg, #0099ff 0%, #5b5fc7 100%); color: #fff; }
    .chat-msg.user .msg-avatar { background: #c19c5b; color: #fff; }
    .msg-bubble {
      padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .chat-msg.bot .msg-bubble { background: #fff; border: 1px solid var(--cs-border); border-top-left-radius: 4px; }
    .chat-msg.user .msg-bubble { background: var(--cs-accent); color: #fff; border-top-right-radius: 4px; }

    .typing { display: inline-flex; gap: 3px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--cs-text-soft); animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

    .suggested-prompts {
      padding: 10px 12px 0 12px;
      border-top: 1px solid var(--cs-border); background: #fff;
      display: flex; flex-direction: column; gap: 6px;
    }
    .sp-label { font-size: 10px; color: var(--cs-text-muted); text-transform: uppercase; letter-spacing: .04em; }
    .sp-chip {
      padding: 8px 12px; border: 1px solid var(--cs-border-strong); border-radius: 18px;
      background: #fff; text-align: left; font-size: 12px; color: var(--cs-text); cursor: pointer;
      transition: all .15s;
    }
    .sp-chip:hover { background: var(--cs-accent-soft); border-color: var(--cs-accent); }

    .chat-input {
      padding: 10px 12px 14px 12px; background: #fff; border-top: 1px solid var(--cs-border);
      border-bottom-left-radius: 10px; border-bottom-right-radius: 10px;
    }
    .chat-input-box {
      display: flex; align-items: center; gap: 8px; border: 1px solid var(--cs-border-strong);
      border-radius: 18px; padding: 6px 6px 6px 12px; background: #fff;
    }
    .chat-input-box:focus-within { border-color: var(--cs-accent); }
    .chat-input-box input {
      flex: 1; border: none; outline: none; font-size: 13px; background: transparent;
    }
    .send-btn {
      width: 28px; height: 28px; border-radius: 50%; background: var(--cs-accent);
      color: #fff; border: none; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 12px;
    }
    .send-btn:disabled { background: #c8c6c4; cursor: not-allowed; }
    .footer-note {
      padding: 8px 12px; font-size: 10px; color: var(--cs-text-soft); text-align: center;
    }

    /* Right column */
    .right-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

    .why-card { padding: 14px 16px; }
    .why-card h3 { margin: 0 0 4px 0; font-size: 13px; color: var(--cs-purple); }
    .why-card .why-text { font-size: 13px; color: var(--cs-text); line-height: 1.5; }
    .why-card .why-tag {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px;
      background: var(--cs-teal-soft); color: var(--cs-teal); margin-bottom: 6px;
      font-weight: 600;
    }

    .agents-card { padding: 14px 16px; }
    .agents-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .agents-card-head h3 { margin: 0; font-size: 14px; }
    .agent-row {
      padding: 12px 0; border-top: 1px solid var(--cs-border);
    }
    .agent-row:first-of-type { border-top: none; }
    .agent-row.dim { opacity: 0.55; }
    .agent-row-head { display: flex; align-items: center; gap: 8px; }
    .agent-num {
      width: 22px; height: 22px; border-radius: 50%; background: var(--cs-accent-soft);
      color: var(--cs-accent); display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .agent-name { font-size: 13px; font-weight: 600; }
    .agent-purpose { font-size: 12px; color: var(--cs-text-muted); line-height: 1.5; margin: 4px 0 6px 30px; }
    .agent-icons { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 30px; }
    .ms-icon {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
      border-radius: 10px; font-size: 10px; color: #fff; font-weight: 600;
    }
    .ms-icon .ms-dot { width: 8px; height: 8px; border-radius: 2px; background: #fff; opacity: .9; }

    /* Excel pane */
    .excel-card { padding: 0; display: flex; flex-direction: column; min-height: 400px; }
    .excel-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-bottom: 1px solid var(--cs-border); background: #f8f8f8;
      border-top-left-radius: 10px; border-top-right-radius: 10px;
    }
    .excel-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--cs-teal);
    }
    .excel-tag::before {
      content: '⊞'; width: 18px; height: 18px; background: var(--cs-teal); color: #fff;
      border-radius: 3px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .download-btn {
      margin-left: auto; padding: 6px 12px; border-radius: 14px;
      background: var(--cs-teal-soft); color: var(--cs-teal); border: 1px solid #a4dccc;
      font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .download-btn:hover { background: #c4ecdc; text-decoration: none; }
    .download-btn .lk { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--cs-teal); }

    .sheet-tabs {
      display: flex; gap: 0; background: #f4f4f4;
      border-bottom: 1px solid var(--cs-border); overflow-x: auto;
    }
    .sheet-tab {
      padding: 6px 12px; font-size: 11px; color: var(--cs-text-muted);
      border-right: 1px solid var(--cs-border); cursor: pointer; white-space: nowrap;
      background: #f4f4f4;
    }
    .sheet-tab.active { background: #fff; color: var(--cs-teal); font-weight: 600; border-bottom: 2px solid var(--cs-teal); margin-bottom: -1px; }
    .sheet-tab:hover { background: #ebebeb; }
    .sheet-tab.active:hover { background: #fff; }

    .viz-area { padding: 10px 12px; }
    .viz-status {
      font-size: 11px; color: var(--cs-text-muted); margin-bottom: 6px;
      padding: 6px 10px; background: #f4f8fd; border-left: 3px solid var(--cs-accent);
      border-radius: 0 4px 4px 0; display: none;
    }
    .viz-status.active { display: block; }

    .kpi-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px; margin-bottom: 8px;
    }
    .kpi {
      background: #fff; border: 1px solid var(--cs-border); border-radius: 6px;
      padding: 8px 10px;
    }
    .kpi .lbl { font-size: 10px; color: var(--cs-text-muted); }
    .kpi .val { font-size: 16px; font-weight: 600; color: var(--cs-purple); }
    .kpi .sub { font-size: 10px; color: var(--cs-text-soft); }

    .chart-box {
      background: #fff; border: 1px solid var(--cs-border); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 8px;
    }
    .chart-box h4 { margin: 0 0 6px 0; font-size: 12px; color: var(--cs-text-muted); font-weight: 600; }
    .bar-chart { display: flex; flex-direction: column; gap: 4px; }
    .bar-row { display: grid; grid-template-columns: 140px 1fr 56px; gap: 8px; align-items: center; font-size: 11px; }
    .bar-row .bar-bg { background: #f3f2f1; border-radius: 3px; height: 16px; overflow: hidden; }
    .bar-row .bar-fill { height: 100%; background: linear-gradient(90deg, var(--cs-accent), var(--cs-purple)); border-radius: 3px; }
    .bar-row .bar-val { text-align: right; font-weight: 600; }

    .donut-svg { display: block; margin: 0 auto; }
    .donut-legend {
      display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; margin-top: 6px;
      font-size: 11px; color: var(--cs-text-muted);
    }
    .donut-legend .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

    .table-wrap { overflow: auto; max-height: 380px; border: 1px solid var(--cs-border); border-radius: 6px; }
    table.excel {
      width: 100%; border-collapse: collapse; font-size: 11px;
      font-family: "Aptos Narrow", "Segoe UI", sans-serif;
    }
    table.excel th, table.excel td {
      padding: 4px 8px; border: 1px solid #e8e8e8; white-space: nowrap;
    }
    table.excel thead th {
      background: #217346; color: #fff; position: sticky; top: 0; z-index: 1; font-weight: 600; text-align: left;
    }
    table.excel tbody tr:nth-child(even) { background: #f4f6f8; }
    table.excel tbody tr.highlight { background: #fff4ce !important; }
    table.excel tbody tr.dim { opacity: 0.35; }
    table.excel td.num { text-align: right; }
    .table-foot {
      font-size: 11px; color: var(--cs-text-muted); padding: 6px 10px;
      border-top: 1px dashed var(--cs-border);
    }

    /* Process diagram */
    .process-card { padding: 14px 16px; }
    .process-card h3 { margin: 0 0 8px 0; font-size: 13px; color: var(--cs-purple); }
    .process-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
    .process-col {
      background: var(--cs-surface-2); border: 1px solid var(--cs-border);
      border-radius: 8px; padding: 10px 12px;
    }
    .process-col.future { background: linear-gradient(135deg, #e7f3fc 0%, #f3f0fa 100%); border-color: #c7dcf0; }
    .process-col h4 { margin: 0 0 6px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .process-col.current h4 { color: var(--cs-text-muted); }
    .process-col.future h4 { color: var(--cs-purple); }
    .process-col ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.5; color: var(--cs-text); }
    .process-col ul li { margin-bottom: 3px; }
    .process-arrow {
      display: flex; align-items: center; justify-content: center; padding: 0 4px;
      font-size: 24px; color: var(--cs-accent);
    }

    /* Stacked variant — fits inside the narrower left column above the chat */
    .process-card.stacked { padding: 12px 14px; }
    .process-card.stacked h3 { font-size: 12px; margin-bottom: 8px; }
    .process-card.stacked .process-row {
      grid-template-columns: 1fr; grid-template-rows: auto auto auto; gap: 8px;
    }
    .process-card.stacked .process-col { padding: 8px 10px; }
    .process-card.stacked .process-col h4 { font-size: 10px; margin-bottom: 4px; }
    .process-card.stacked .process-col ul { padding-left: 14px; font-size: 11.5px; line-height: 1.4; }
    .process-card.stacked .process-col ul li { margin-bottom: 2px; }
    .process-card.stacked .process-arrow {
      padding: 0; font-size: 18px;
      transform: rotate(90deg); height: 18px;
    }

    /* Execution console */
    .exec-card { padding: 14px 16px; display: none; }
    .exec-card.active { display: block; }
    .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .exec-head h3 { margin: 0; font-size: 13px; color: var(--cs-purple); }
    .exec-pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--cs-teal-soft); color: var(--cs-teal); font-weight: 600; }
    .exec-pill.running { background: #fff4ce; color: #806000; }
    .exec-pill.done { background: var(--cs-teal-soft); color: var(--cs-teal); }
    .step-list { display: flex; flex-direction: column; gap: 6px; }
    .step {
      display: grid; grid-template-columns: 24px 1fr auto; grid-template-rows: auto auto;
      column-gap: 8px; row-gap: 6px; align-items: start;
      padding: 8px 10px; border: 1px solid var(--cs-border); border-radius: 6px;
      background: #fff; font-size: 12px;
    }
    .step .step-num, .step .step-text, .step .step-time { align-self: center; }
    .step.running { border-color: var(--cs-accent); background: #f4f8fd; }
    .step.done { border-color: #c1e8d5; background: #f3faf6; }
    .step-num {
      width: 22px; height: 22px; border-radius: 50%; background: var(--cs-surface-2);
      color: var(--cs-text-muted); display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
    }
    .step.running .step-num { background: var(--cs-accent); color: #fff; }
    .step.done .step-num { background: var(--cs-green); color: #fff; }
    .step-time { font-size: 11px; color: var(--cs-text-soft); }
    /* Chain-of-thought block under each step */
    .step-cot {
      grid-column: 2 / -1; margin-top: 2px;
      border-left: 2px solid var(--cs-border);
      padding: 4px 0 2px 10px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .step.running .step-cot { border-left-color: var(--cs-accent); }
    .step.done .step-cot { border-left-color: var(--cs-green); }
    .cot-line {
      font-size: 11.5px; color: var(--cs-text-muted); line-height: 1.45;
      font-style: italic; display: flex; gap: 6px; align-items: flex-start;
      opacity: 0; transform: translateY(-2px); transition: opacity .35s ease, transform .35s ease;
    }
    .cot-line.show { opacity: 1; transform: translateY(0); }
    .cot-line .cot-glyph { color: var(--cs-accent); font-style: normal; flex: 0 0 10px; }
    .cot-line.handoff { color: var(--cs-purple); font-style: normal; font-weight: 600; }
    .cot-line.handoff .cot-glyph { color: var(--cs-purple); }
    .cot-typing {
      font-size: 11px; color: var(--cs-text-soft); font-style: italic; padding: 2px 0;
      display: none;
    }
    .step.running .cot-typing { display: block; }
    .cot-typing::after {
      content: ''; display: inline-block; margin-left: 2px;
      animation: cot-dots 1.1s steps(4, end) infinite;
    }
    @keyframes cot-dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    /* Misc */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--cs-accent);
      cursor: pointer; margin-bottom: 8px;
    }
    .back-link:hover { text-decoration: underline; }
    .page-title { font-size: 22px; font-weight: 600; margin: 4px 0 12px 0; display: flex; align-items: center; gap: 12px; }
    .page-title .pt-icon {
      width: 36px; height: 36px; border-radius: 8px; background: var(--cs-teal-soft);
      display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .page-title small { font-size: 11px; color: var(--cs-text-muted); font-weight: 400; display: block; margin-top: 2px; }

    .run-bar {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: linear-gradient(90deg, #f3f0fa, #e7f3fc);
      border: 1px solid #d6d9ec; border-radius: 8px; margin-bottom: 12px;
    }
    .run-bar .label { font-size: 12px; color: var(--cs-text-muted); }
    .run-bar .actions { margin-left: auto; display: flex; gap: 8px; }

    @media (max-width: 1100px) {
      .demo-runner { grid-template-columns: 1fr; }
      .left-col { max-height: none; }
      .chat-panel { max-height: 540px; }
    }

    /* ---------- Output artifacts ---------- */
    .artifacts-card {
      display: none; margin-top: 16px; padding: 0; overflow: hidden;
      border: 1px solid var(--cs-border); border-radius: 8px; background: #fff;
    }
    .artifacts-card.active { display: block; }
    .artifacts-head {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--cs-border);
      background: linear-gradient(90deg, #f3f0fa, #e7f3fc);
    }
    .artifacts-head h3 { margin: 0; font-size: 14px; color: var(--cs-purple); }
    .artifacts-head .sub { font-size: 11px; color: var(--cs-text-muted); }
    .artifacts-head .artifacts-badge {
      margin-left: auto; font-size: 10px; padding: 3px 9px; border-radius: 10px;
      background: var(--cs-teal-soft); color: var(--cs-teal); font-weight: 600;
    }
    .art-tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--cs-border); background: #fafbfc;
      padding: 0 12px;
    }
    .art-tab {
      padding: 10px 14px; font-size: 12px; color: var(--cs-text-muted);
      border-bottom: 2px solid transparent; cursor: pointer; user-select: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .art-tab .art-glyph { font-size: 13px; }
    .art-tab:hover { color: var(--cs-text); }
    .art-tab.active { color: var(--cs-purple); border-bottom-color: var(--cs-purple); background: #fff; font-weight: 600; }
    .art-pane { display: none; padding: 16px 18px; }
    .art-pane.active { display: block; }

    /* KPIs tab */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    @media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-tile {
      border: 1px solid var(--cs-border); border-radius: 8px; padding: 12px 14px; background: #fff;
      display: flex; flex-direction: column; gap: 2px; position: relative;
    }
    .kpi-tile .lbl { font-size: 11px; color: var(--cs-text-muted); text-transform: uppercase; letter-spacing: .4px; }
    .kpi-tile .val { font-size: 20px; font-weight: 600; color: var(--cs-text); margin-top: 2px; }
    .kpi-tile .sub { font-size: 11px; color: var(--cs-text-soft); }
    .kpi-tile .trend {
      position: absolute; top: 8px; right: 10px; font-size: 10px;
      padding: 2px 6px; border-radius: 8px; font-weight: 600;
    }
    .kpi-tile .trend.up { background: #dcfce7; color: #056b3a; }
    .kpi-tile .trend.down { background: #fde7ea; color: #a4262c; }
    .kpi-callout {
      margin-top: 12px; padding: 10px 14px; border: 1px dashed #d3c4ea;
      background: #faf7ff; border-radius: 6px; font-size: 12px; color: var(--cs-text-muted);
    }
    .kpi-callout b { color: var(--cs-purple); }

    /* Metrics Workbook tab — embeds the Excel-style view */
    .mw-toolbar {
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      border: 1px solid var(--cs-border); border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, #f8f8f8, #f1f1f1);
    }
    .mw-tag {
      font-size: 11px; padding: 3px 8px; border-radius: 4px;
      background: #117865; color: #fff; font-weight: 600;
    }
    .mw-body {
      border: 1px solid var(--cs-border); border-top: none;
      border-radius: 0 0 6px 6px;
    }
    .mw-viz-row { padding: 10px 12px; border-bottom: 1px solid var(--cs-border); }
    .mw-table-wrap { max-height: 360px; overflow: auto; }
    .mw-foot { padding: 8px 12px; font-size: 11px; color: var(--cs-text-muted); background: #fafbfc; }

    /* Narrative tab */
    .nar-card {
      border-left: 3px solid var(--cs-purple); padding: 4px 14px; background: #faf7ff;
      border-radius: 0 6px 6px 0; margin-bottom: 12px;
    }
    .nar-card p { font-size: 13px; line-height: 1.55; color: var(--cs-text); margin: 10px 0; }
    .nar-foot {
      font-size: 11px; color: var(--cs-text-muted); padding: 8px 12px;
      background: #f4f7fa; border-radius: 6px;
    }
    .nar-foot b { color: var(--cs-purple); }

    /* Additional questions tab */
    .aq-intro { font-size: 12px; color: var(--cs-text-muted); margin-bottom: 10px; }
    .aq-list { display: flex; flex-direction: column; gap: 8px; }
    .aq-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 12px; border: 1px solid var(--cs-border); border-radius: 6px;
      background: #fff; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .aq-item:hover { border-color: var(--cs-accent); background: #f4f8fd; }
    .aq-glyph {
      flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%;
      background: var(--cs-teal-soft); color: var(--cs-teal);
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    }
    .aq-text { font-size: 12.5px; line-height: 1.45; color: var(--cs-text); }
    .aq-go { margin-left: auto; font-size: 11px; color: var(--cs-accent); white-space: nowrap; }

    /* ---------- Flow tree (Copilot Studio canvas style) ---------- */
    .flow-head {
      display: flex; align-items: flex-start; gap: 14px; padding: 14px 0 18px;
    }
    .flow-head .flow-icon { font-size: 26px; line-height: 1; }
    .flow-head h2 { margin: 0; font-size: 18px; }
    .flow-head .sub { color: var(--cs-text-muted); font-size: 12px; margin-top: 4px; }
    .flow-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    .flow-canvas {
      background:
        linear-gradient(#fafbfd, #fafbfd) padding-box,
        radial-gradient(#e5e7ec 1px, transparent 1px) 0 0 / 14px 14px;
      border: 1px solid var(--cs-border);
      border-radius: 10px;
      padding: 32px 36px 40px;
    }
    .flow-tree { display: flex; flex-direction: column; align-items: center; }

    .flow-node {
      width: min(640px, 96%);
      background: #fff;
      border: 1px solid var(--cs-border-strong);
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.04);
      overflow: hidden;
    }
    .flow-node.trigger { border-color: #d9c8ee; }
    .flow-node.agent { border-color: #c7dcef; }
    .flow-node.outcome { border-color: #c1e8d5; }

    .flow-node-head {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 1px solid var(--cs-border);
    }
    .flow-node.trigger .flow-node-head { background: linear-gradient(180deg, #f6f0fd, #fbf7ff); }
    .flow-node.agent .flow-node-head { background: linear-gradient(180deg, #eff5fc, #f8fbff); }
    .flow-node.outcome .flow-node-head { background: linear-gradient(180deg, #ecf7f1, #f6fbf8); }

    .flow-node-tag {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 10px;
    }
    .flow-node.trigger .flow-node-tag { color: var(--cs-purple); background: #f0e6fa; }
    .flow-node.agent .flow-node-tag { color: var(--cs-accent); background: var(--cs-accent-soft); }
    .flow-node.outcome .flow-node-tag { color: #0a7c3d; background: #e2f5ea; }

    .flow-node-title { font-weight: 600; font-size: 13px; color: var(--cs-text); }
    .flow-node-icon { font-size: 18px; line-height: 1; }
    .flow-node-num {
      width: 22px; height: 22px; border-radius: 50%; background: var(--cs-accent);
      color: #fff; font-size: 11px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .flow-node-body {
      padding: 10px 14px; font-size: 12.5px; color: var(--cs-text-muted); line-height: 1.5;
    }
    .flow-node-body p { margin: 0 0 8px; color: var(--cs-text); }
    .flow-node-icons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

    .flow-branches {
      list-style: none; padding: 6px 0 8px 8px; margin: 8px 0 0;
      border-top: 1px dashed var(--cs-border);
    }
    .flow-branch {
      position: relative; padding: 5px 6px 5px 26px;
      font-size: 12px; color: var(--cs-text-muted); line-height: 1.45;
    }
    .flow-branch::before {
      content: ''; position: absolute; left: 8px; top: 0; bottom: 50%;
      border-left: 1.5px solid var(--cs-border-strong);
    }
    .flow-branch::after {
      content: ''; position: absolute; left: 8px; top: 50%; width: 12px;
      border-top: 1.5px solid var(--cs-border-strong);
    }
    .flow-branch:last-child::before { bottom: 50%; }
    .flow-branch .glyph {
      position: absolute; left: 22px; top: 5px; color: var(--cs-accent); font-size: 11px;
    }
    .flow-branch.handoff {
      color: var(--cs-purple); font-weight: 600;
      background: linear-gradient(180deg, #f7f1fd, transparent);
      border-radius: 6px;
    }
    .flow-branch.handoff::before, .flow-branch.handoff::after { border-color: var(--cs-purple); }
    .flow-branch.handoff .glyph { color: var(--cs-purple); }

    .flow-connector {
      width: 2px; height: 26px; background: var(--cs-border-strong);
      position: relative;
    }
    .flow-connector::after {
      content: '▼'; position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%);
      color: var(--cs-border-strong); font-size: 10px;
    }
    .flow-connector.purple { background: var(--cs-purple); }
    .flow-connector.purple::after { color: var(--cs-purple); }
    .flow-connector.green { background: #4caa78; }
    .flow-connector.green::after { color: #4caa78; }

    .flow-meta {
      margin-top: 22px; padding: 14px 18px; border: 1px solid var(--cs-border);
      border-radius: 10px; background: #fff;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;
    }
    .flow-meta .meta-cell .lbl {
      font-size: 11px; color: var(--cs-text-soft); text-transform: uppercase;
      letter-spacing: 0.06em; font-weight: 700; margin-bottom: 4px;
    }
    .flow-meta .meta-cell .val { font-size: 13px; color: var(--cs-text); line-height: 1.5; }

    .flow-actions { display: flex; gap: 8px; align-items: center; }
    .flow-back-link {
      font-size: 12px; color: var(--cs-accent); cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .flow-back-link:hover { text-decoration: underline; }

    /* ---- Tools page (Copilot Studio Tools tab look) ---- */
    .tools-head {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 16px; align-items: start;
      margin: 16px 0 18px 0; padding: 18px 22px;
      background: linear-gradient(180deg, #fff 0%, #f6f7fb 100%);
      border: 1px solid var(--cs-border); border-radius: 12px;
    }
    .tools-head .tools-icon {
      width: 56px; height: 56px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      background: linear-gradient(135deg, #efe6ff, #e5edff);
      border: 1px solid #d8d8e8;
    }
    .tools-head h2 { margin: 0 0 4px 0; font-size: 20px; color: var(--cs-text); }
    .tools-head .sub { font-size: 13px; color: var(--cs-text-soft); margin-bottom: 6px; }

    .tools-toolbar {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 10px 12px; margin: 0 0 16px 0;
      background: #fff; border: 1px solid var(--cs-border); border-radius: 10px;
    }
    .tool-chip {
      font-size: 12px; color: var(--cs-text-soft);
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--cs-border); background: #fff;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 120ms ease;
    }
    .tool-chip:hover { border-color: #c7c8d4; color: var(--cs-text); }
    .tool-chip.on { background: var(--cs-purple); color: #fff; border-color: var(--cs-purple); }
    .tool-chip .count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; padding: 0 5px; height: 16px; border-radius: 9px;
      background: rgba(0,0,0,0.08); font-size: 11px; font-weight: 700;
    }
    .tool-chip.on .count { background: rgba(255,255,255,0.22); color: #fff; }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .tool-card {
      position: relative;
      background: #fff; border: 1px solid var(--cs-border); border-radius: 12px;
      padding: 14px 16px 14px 18px;
      display: flex; flex-direction: column; gap: 10px;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      overflow: hidden;
    }
    .tool-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(20,20,40,0.08);
      border-color: #c7c8d4;
    }
    .tool-card::before {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
      background: var(--cs-border);
    }
    .tool-card.cat-external::before  { background: #d83b01; }
    .tool-card.cat-internal::before  { background: #ca7c08; }
    .tool-card.cat-microsoft::before { background: var(--cs-accent); }

    .tool-card-head {
      display: grid; grid-template-columns: 36px 1fr auto;
      gap: 10px; align-items: center;
    }
    .tool-card .tool-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      background: #f4f4f8; border: 1px solid var(--cs-border);
    }
    .tool-card .tool-name {
      font-size: 14px; font-weight: 600; color: var(--cs-text); line-height: 1.25;
    }
    .tool-kind {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 999px; color: #fff;
    }
    .tool-kind-mcp        { background: var(--cs-purple); }
    .tool-kind-connector  { background: var(--cs-accent); }
    .tool-kind-knowledge  { background: #03787c; }
    .tool-kind-system     { background: #4a5160; }
    .tool-kind-action     { background: #d35400; }

    .tool-card-body p {
      margin: 0; font-size: 12.5px; color: var(--cs-text-soft); line-height: 1.45;
    }
    .tool-card-foot {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding-top: 8px; border-top: 1px dashed var(--cs-border);
    }
    .tool-auth, .tool-used, .tool-cat-chip {
      font-size: 11px; padding: 3px 8px; border-radius: 6px;
      background: #f4f4f8; color: var(--cs-text-soft);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .tool-cat-chip { background: #fff; border: 1px solid var(--cs-border); }
    .tool-cat-chip.external  { color: #d83b01; border-color: #f3c8b7; }
    .tool-cat-chip.internal  { color: #ca7c08; border-color: #f1d6a4; }
    .tool-cat-chip.microsoft { color: var(--cs-accent); border-color: #c5d4ee; }

    .tools-empty {
      padding: 30px; text-align: center; color: var(--cs-text-soft);
      background: #fff; border: 1px dashed var(--cs-border); border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ====== Copilot Studio top bar ====== -->
    <div class="top-bar">
      <button class="waffle" title="App launcher" aria-label="App launcher">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="10" cy="3" r="1.5"/><circle cx="17" cy="3" r="1.5"/><circle cx="3" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="17" cy="10" r="1.5"/><circle cx="3" cy="17" r="1.5"/><circle cx="10" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/></svg>
      </button>
      <div class="ms-logo">
        <div class="ms-grid"><div></div><div></div><div></div><div></div></div>
        <div class="ms-name">Microsoft</div>
      </div>
      <div class="product-name">Demo Site</div>
      <div class="top-spacer"></div>
      <div class="top-actions">
        <div class="env-pill">
          <div class="env-label">Environment</div>
          <div>FSI Demo · Risk</div>
        </div>
        <button class="top-icon-btn" title="Settings">⚙</button>
        <button class="top-icon-btn" title="Help">?</button>
        <div class="top-avatar">TP</div>
      </div>
    </div>

    <!-- ====== Body: left rail + main ====== -->
    <div class="body">
      <nav class="left-rail" aria-label="Primary">
        <button class="rail-btn" data-nav="home"><span class="rail-icon">🏠</span><span class="rail-label">Home</span></button>
        <button class="rail-btn active" data-nav="agents"><span class="rail-icon">🤖</span><span class="rail-label">Agents</span></button>
        <button class="rail-btn" data-nav="flows"><span class="rail-icon">⤴</span><span class="rail-label">Flows</span></button>
        <button class="rail-btn" data-nav="tools"><span class="rail-icon">🧰</span><span class="rail-label">Tools</span></button>
        <button class="rail-btn" data-nav="more"><span class="rail-icon">⋯</span><span class="rail-label"></span></button>
      </nav>

      <main class="main">
        <!-- Sub-header with agent name + tabs (Copilot Studio style) -->
        <div class="sub-header">
          <div class="agent-id">
            <div class="agent-icon">⚡</div>
            <div>
              <div class="agent-title">Copilot Risk Assistant</div>
            </div>
            <span class="lock-icon" title="Protected">🔒</span>
          </div>
          <div class="tabs">
            <div class="tab active" data-tab="overview">Overview</div>
            <div class="tab" data-tab="knowledge">Knowledge</div>
            <div class="tab" data-tab="tools">Tools</div>
            <div class="tab" data-tab="agents">Agents</div>
            <div class="tab" data-tab="topics">Topics</div>
            <div class="tab" data-tab="activity">Activity</div>
            <div class="tab" data-tab="evaluation">Evaluation</div>
            <div class="tab" data-tab="analytics">Analytics</div>
            <div class="tab" data-tab="channels">Channels</div>
          </div>
          <div class="sub-actions">
            <button class="btn-ghost" title="Search">🔎</button>
            <button class="btn-outline btn-disabled" disabled>Publish</button>
            <button class="btn-outline">Settings</button>
            <button class="btn-ghost">⋯</button>
            <button class="test-btn">⚗ Test</button>
          </div>
        </div>

        <div class="banner" id="banner">
          <span class="banner-x">●</span>
          <span><b>10 prioritized risk agents</b> are live in this environment — click any card below to run the agentic flow against synthetic data.</span>
        </div>

        <div class="content" id="content"><!-- rendered by JS --></div>
      </main>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------
    // Data loading. We try fetch (works on http://localhost or static host).
    // If fetch is blocked (file:// origin), we fall back to a <script type="application/json">
    // that the user can paste in if needed. We always try fetch first.
    // ---------------------------------------------------------------------
    let DATA = null;

    async function loadData() {
      try {
        const res = await fetch('demos.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch failed');
        DATA = await res.json();
        return;
      } catch (e) { /* fall through */ }
      // Inline fallback marker — the build script can inject JSON into this <script>.
      const tag = document.getElementById('inline-demos');
      if (tag) {
        try { DATA = JSON.parse(tag.textContent); return; }
        catch (e) { /* ignore */ }
      }
      DATA = { demos: [], ms_icons: {}, workbook_filename: 'Payments_Copilot_Studio_Workbook.xlsx' };
    }

    // ---------------------------------------------------------------------
    // Tiny router (#home, #demo/<id>, #flow/<id>)
    // ---------------------------------------------------------------------
    let LAST_DEMO_ID = null;

    function currentRoute() {
      const h = window.location.hash.replace(/^#/, '');
      if (h.startsWith('demo/')) return { view: 'demo', id: h.slice(5) };
      if (h.startsWith('flow/')) return { view: 'flow', id: h.slice(5) };
      if (h.startsWith('tools/')) return { view: 'tools', id: h.slice(6) };
      return { view: 'home' };
    }
    window.addEventListener('hashchange', render);

    function nav(view, id) {
      if (view === 'home') window.location.hash = '';
      else if (view === 'demo') window.location.hash = '#demo/' + id;
      else if (view === 'flow') window.location.hash = '#flow/' + id;
      else if (view === 'tools') window.location.hash = '#tools/' + id;
    }

    function bindRail() {
      document.querySelectorAll('.rail-btn[data-nav]').forEach(btn => {
        if (btn.dataset.wired === '1') return;
        btn.dataset.wired = '1';
        btn.addEventListener('click', () => {
          const target = btn.dataset.nav;
          if (target === 'home' || target === 'agents') {
            nav('home');
          } else if (target === 'flows') {
            const id = LAST_DEMO_ID || (DATA.demos[0] && DATA.demos[0].id);
            if (id) nav('flow', id);
          } else if (target === 'tools') {
            const id = LAST_DEMO_ID || (DATA.demos[0] && DATA.demos[0].id);
            if (id) nav('tools', id);
          }
        });
      });
    }

    function updateRailActive() {
      const route = currentRoute();
      document.querySelectorAll('.rail-btn[data-nav]').forEach(btn => btn.classList.remove('active'));
      const map = { home: 'agents', demo: 'agents', flow: 'flows', tools: 'tools' };
      const target = map[route.view] || 'agents';
      const el = document.querySelector(`.rail-btn[data-nav="${target}"]`);
      if (el) el.classList.add('active');
    }

    // ---------------------------------------------------------------------
    // Renderers
    // ---------------------------------------------------------------------
    function fmt$(n) {
      if (n >= 1_000_000) return '$' + (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return '$' + (n / 1_000).toFixed(0) + 'k';
      return '$' + n;
    }
    function fmtN(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(0) + 'k';
      return n;
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function msIconChip(name) {
      const meta = (DATA.ms_icons || {})[name] || { label: name, color: '#605e5c' };
      return `<span class="ms-icon" style="background:${meta.color}" title="${esc(name)}">
        <span class="ms-dot"></span>${esc(meta.label)}
      </span>`;
    }

    function render() {
      const route = currentRoute();
      const content = document.getElementById('content');
      const banner = document.getElementById('banner');
      bindRail();
      updateRailActive();
      if (route.view === 'home') {
        banner.style.display = '';
        content.innerHTML = renderHome();
        bindHome();
      } else if (route.view === 'flow') {
        const demo = DATA.demos.find(d => d.id === route.id);
        if (!demo) { window.location.hash = ''; return; }
        LAST_DEMO_ID = demo.id;
        banner.style.display = 'none';
        content.innerHTML = renderFlow(demo);
        bindFlow(demo);
      } else if (route.view === 'tools') {
        const demo = DATA.demos.find(d => d.id === route.id);
        if (!demo) { window.location.hash = ''; return; }
        LAST_DEMO_ID = demo.id;
        banner.style.display = 'none';
        content.innerHTML = renderTools(demo);
        bindTools(demo);
      } else {
        const demo = DATA.demos.find(d => d.id === route.id);
        if (!demo) { window.location.hash = ''; return; }
        LAST_DEMO_ID = demo.id;
        banner.style.display = 'none';
        content.innerHTML = renderDemo(demo);
        bindDemo(demo);
      }
    }

    function renderHome() {
      const totals = DATA.demos.reduce((acc, d) => {
        acc.savings += d.annual_savings || 0;
        acc.cases += d.cases_per_year || 0;
        acc.hoursPerCase += d.manual_hours || 0;
        return acc;
      }, { savings: 0, cases: 0, hoursPerCase: 0 });
      const avgAutomation = (DATA.demos.reduce((a, d) => a + (d.automation_rate || 0), 0) / DATA.demos.length * 100).toFixed(0);

      const heroHTML = `
        <div class="home-hero">
          <h1>Agentic risk — 10 use cases, one strategy</h1>
          <p>The Copilot Risk Assistant fronts ten Microsoft agentic patterns that automate the highest-cost manual risk processes across the bank's risk taxonomy. Each agent uses an existing Microsoft asset (FDE / ISD Security Agents / STU FSI / GBB accelerators / Agent 365), runs against synthetic data live, and surfaces concrete ROI you can take to your CFO.</p>
          <div class="roi-strip">
            <div class="roi-tile"><div class="lbl">Annual savings</div><div class="val">${fmt$(totals.savings)}</div><div class="sub">Across 10 agents at run-rate</div></div>
            <div class="roi-tile"><div class="lbl">Cases / yr automated</div><div class="val">${fmtN(totals.cases)}</div><div class="sub">Triaged with human-in-the-loop</div></div>
            <div class="roi-tile"><div class="lbl">Avg automation rate</div><div class="val">${avgAutomation}%</div><div class="sub">Hours that move off the floor</div></div>
            <div class="roi-tile"><div class="lbl">Microsoft architectures</div><div class="val">5</div><div class="sub">FDE · ISD · STU · GBB · Agent 365</div></div>
          </div>
        </div>
        <div class="section-title">Choose a demo</div>
        <div class="demo-grid">
          ${DATA.demos.map(d => `
            <div class="demo-card" data-id="${esc(d.id)}">
              <div class="card-head">
                <div class="card-icon">${esc(d.icon || '⚙')}</div>
                <div>
                  <div class="card-num">Demo ${esc(d.num)} · ${esc(d.domain)}</div>
                  <h3 class="card-title">${esc(d.title)}</h3>
                </div>
              </div>
              <span class="card-domain">${esc(d.domain)}</span>
              <p>${esc(d.tagline)}</p>
              <div class="card-roi">
                <div class="roi-line"><div class="lbl">Annual $</div><div class="val">${fmt$(d.annual_savings)}</div></div>
                <div class="roi-line"><div class="lbl">Cases / yr</div><div class="val">${fmtN(d.cases_per_year)}</div></div>
                <div class="roi-line"><div class="lbl">Automation</div><div class="val">${Math.round(d.automation_rate*100)}%</div></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      return heroHTML;
    }

    function bindHome() {
      document.querySelectorAll('.demo-card').forEach(c => {
        c.addEventListener('click', () => nav('demo', c.dataset.id));
      });
    }

    // ---------------------------------------------------------------------
    // Flow view — Copilot Studio style tree of the agentic workflow
    // ---------------------------------------------------------------------
    function renderFlow(demo) {
      const triggerNode = `
        <div class="flow-node trigger">
          <div class="flow-node-head">
            <span class="flow-node-icon">⚡</span>
            <span class="flow-node-tag">Trigger</span>
            <span class="flow-node-title">When this fires</span>
          </div>
          <div class="flow-node-body">
            <p>${esc(demo.trigger || 'Manual run from Copilot Studio')}</p>
          </div>
        </div>`;

      const agentNodes = demo.agents.map((agent, idx) => {
        const cot = agent.cot || [];
        const branches = cot.map((line, i) => {
          const isHandoff = i === cot.length - 1;
          const cls = 'flow-branch' + (isHandoff ? ' handoff' : '');
          const glyph = isHandoff ? '→' : '▸';
          return `<li class="${cls}"><span class="glyph">${glyph}</span>${esc(line)}</li>`;
        }).join('');
        const icons = (agent.capabilities || []).map(msIconChip).join('');
        return `
          <div class="flow-connector"></div>
          <div class="flow-node agent" data-agent-idx="${idx}">
            <div class="flow-node-head">
              <span class="flow-node-num">${idx+1}</span>
              <span class="flow-node-tag">Agent</span>
              <span class="flow-node-title">${esc(agent.name)}</span>
            </div>
            <div class="flow-node-body">
              <p>${esc(agent.purpose || '')}</p>
              ${icons ? `<div class="flow-node-icons">${icons}</div>` : ''}
              ${branches ? `<ul class="flow-branches">${branches}</ul>` : ''}
            </div>
          </div>`;
      }).join('');

      const outcomeText = demo.roi || 'Cycle time, capacity and audit-trail uplift captured in the ROI panel.';
      const outcomeNode = `
        <div class="flow-connector green"></div>
        <div class="flow-node outcome">
          <div class="flow-node-head">
            <span class="flow-node-icon">🎯</span>
            <span class="flow-node-tag">Outcome</span>
            <span class="flow-node-title">Result + ROI</span>
          </div>
          <div class="flow-node-body">
            <p>${esc(outcomeText)}</p>
            <div class="flow-node-icons">
              <span class="ms-icon" style="background:#107c41" title="Annual savings"><span class="ms-dot"></span>${fmt$(demo.annual_savings || 0)} / yr</span>
              <span class="ms-icon" style="background:#0078d4" title="Cases per year"><span class="ms-dot"></span>${fmtN(demo.cases_per_year || 0)} cases / yr</span>
              <span class="ms-icon" style="background:#6264a7" title="Automation"><span class="ms-dot"></span>${Math.round((demo.automation_rate || 0)*100)}% automated</span>
            </div>
          </div>
        </div>`;

      const metaHTML = `
        <div class="flow-meta">
          <div class="meta-cell"><div class="lbl">Pattern</div><div class="val">${esc(demo.pattern || '—')}</div></div>
          <div class="meta-cell"><div class="lbl">Microsoft pattern source</div><div class="val">${esc(demo.teams_ref || '—')}</div></div>
          <div class="meta-cell"><div class="lbl">Domain</div><div class="val">${esc(demo.domain || '—')}</div></div>
        </div>`;

      return `
        <div class="flow-head">
          <div class="flow-icon">${esc(demo.icon || '⚙')}</div>
          <div>
            <h2>Agentic workflow — ${esc(demo.title)}</h2>
            <div class="sub">Demo ${esc(demo.num)} · ${esc(demo.domain)} · Copilot Studio canvas view</div>
            <div class="flow-back-link" data-back="home">← Back to all agents</div>
          </div>
          <div class="right flow-actions">
            <button class="btn-outline" data-flow-action="open-demo">Open runnable demo</button>
          </div>
        </div>
        <div class="flow-canvas">
          <div class="flow-tree">
            ${triggerNode}
            ${agentNodes}
            ${outcomeNode}
          </div>
        </div>
        ${metaHTML}
      `;
    }

    function bindFlow(demo) {
      const back = document.querySelector('.flow-back-link[data-back="home"]');
      if (back) back.addEventListener('click', () => nav('home'));
      const open = document.querySelector('[data-flow-action="open-demo"]');
      if (open) open.addEventListener('click', () => nav('demo', demo.id));
    }

    // ---------------------------------------------------------------------
    // Tools view — Copilot Studio style catalog of MCP servers, connectors,
    // internal systems and knowledge sources wired to this agent.
    // ---------------------------------------------------------------------
    const TOOL_KIND_LABELS = {
      all: 'All', mcp: 'MCP server', connector: 'Connector',
      knowledge: 'Knowledge', system: 'Internal system', action: 'Action',
    };

    function renderTools(demo) {
      const tools = demo.tools || [];
      if (!tools.length) {
        return `
          <div class="tools-head">
            <div class="tools-icon">🧰</div>
            <div>
              <h2>Tools — ${esc(demo.title)}</h2>
              <div class="sub">No tools catalogued yet for this demo.</div>
              <div class="flow-back-link" data-back="home">← Back to all agents</div>
            </div>
            <div class="right flow-actions">
              <button class="btn-outline" data-tools-action="open-demo">Open runnable demo</button>
            </div>
          </div>
          <div class="tools-empty">Tools catalog coming soon.</div>`;
      }

      const kindOrder = ['all', 'mcp', 'connector', 'knowledge', 'system', 'action'];
      const counts = { all: tools.length };
      kindOrder.slice(1).forEach(k => { counts[k] = tools.filter(t => t.kind === k).length; });

      const chips = kindOrder
        .filter(k => k === 'all' || counts[k] > 0)
        .map(k => `<button class="tool-chip ${k === 'all' ? 'on' : ''}" data-kind="${k}">${TOOL_KIND_LABELS[k]}<span class="count">${counts[k]}</span></button>`)
        .join('');

      const cards = tools.map(t => {
        const cat = (t.category || '').toLowerCase();
        const used = (t.used_by || []).length
          ? `<span class="tool-used">▸ Used by ${t.used_by.map(n => 'step ' + n).join(', ')}</span>`
          : '';
        return `
          <div class="tool-card cat-${cat}" data-kind="${esc(t.kind)}">
            <div class="tool-card-head">
              <span class="tool-icon">${esc(t.icon || '🔧')}</span>
              <div class="tool-name">${esc(t.name)}</div>
              <span class="tool-kind tool-kind-${esc(t.kind)}">${esc(TOOL_KIND_LABELS[t.kind] || t.kind)}</span>
            </div>
            <div class="tool-card-body"><p>${esc(t.purpose || '')}</p></div>
            <div class="tool-card-foot">
              <span class="tool-cat-chip ${cat}">${esc(t.category || '')}</span>
              <span class="tool-auth">🔐 ${esc(t.auth || '—')}</span>
              ${used}
            </div>
          </div>`;
      }).join('');

      return `
        <div class="tools-head">
          <div class="tools-icon">🧰</div>
          <div>
            <h2>Tools — ${esc(demo.title)}</h2>
            <div class="sub">Demo ${esc(demo.num)} · ${esc(demo.domain)} · MCP servers, Power Platform connectors, internal systems and knowledge wired into this Copilot Studio agent.</div>
            <div class="flow-back-link" data-back="home">← Back to all agents</div>
          </div>
          <div class="right flow-actions">
            <button class="btn-outline" data-tools-action="open-flow">View workflow</button>
            <button class="btn-outline" data-tools-action="open-demo">Open runnable demo</button>
          </div>
        </div>
        <div class="tools-toolbar">${chips}</div>
        <div class="tools-grid">${cards}</div>
      `;
    }

    function bindTools(demo) {
      const back = document.querySelector('.flow-back-link[data-back="home"]');
      if (back) back.addEventListener('click', () => nav('home'));
      document.querySelector('[data-tools-action="open-demo"]')?.addEventListener('click', () => nav('demo', demo.id));
      document.querySelector('[data-tools-action="open-flow"]')?.addEventListener('click', () => nav('flow', demo.id));
      document.querySelectorAll('.tools-toolbar .tool-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.tools-toolbar .tool-chip').forEach(c => c.classList.remove('on'));
          chip.classList.add('on');
          const kind = chip.dataset.kind;
          document.querySelectorAll('.tools-grid .tool-card').forEach(card => {
            card.style.display = (kind === 'all' || card.dataset.kind === kind) ? '' : 'none';
          });
        });
      });
    }

    // ---------------------------------------------------------------------
    // Demo view
    // ---------------------------------------------------------------------
    function renderDemo(demo) {
      const cols = demo.data_columns;
      const rows = demo.rows || [];

      const agentsHTML = demo.agents.map((a, i) => `
        <div class="agent-row" data-agent-idx="${i}">
          <div class="agent-row-head">
            <span class="agent-num">${i+1}</span>
            <span class="agent-name">${esc(a.name)}</span>
          </div>
          <div class="agent-purpose">${esc(a.purpose)}</div>
          <div class="agent-icons">${a.capabilities.map(msIconChip).join('')}</div>
        </div>
      `).join('');

      const tableHTML = renderTable(cols, rows.slice(0, 60));

      const kpiHTML = `
        <div class="kpi-row">
          <div class="kpi"><div class="lbl">Manual hrs / case</div><div class="val">${demo.manual_hours}</div><div class="sub">Before agents</div></div>
          <div class="kpi"><div class="lbl">Agentic min / case</div><div class="val">${demo.auto_minutes}</div><div class="sub">After agents</div></div>
          <div class="kpi"><div class="lbl">Cases / year</div><div class="val">${fmtN(demo.cases_per_year)}</div><div class="sub">Demand pool</div></div>
          <div class="kpi"><div class="lbl">Annual $ saving</div><div class="val">${fmt$(demo.annual_savings)}</div><div class="sub">At run rate</div></div>
        </div>
      `;

      // Richer KPI grid for the Output artifacts > KPIs tab
      const casesAuto = Math.round(demo.cases_per_year * demo.automation_rate);
      const casesHuman = demo.cases_per_year - casesAuto;
      const manualMin = (demo.manual_hours || 0) * 60;
      const cycleReductionPct = manualMin > 0 ? Math.round(100 * (1 - (demo.auto_minutes / manualMin))) : 0;
      const fteFreed = Math.round((demo.cases_per_year * (demo.manual_hours - demo.auto_minutes/60)) / 1800);
      const artifactsKpisHTML = `
        <div class="kpi-grid">
          <div class="kpi-tile">
            <span class="trend up">▲ ${demo.automation_rate ? Math.round(demo.automation_rate*100) : 0}%</span>
            <div class="lbl">Cases auto-resolved</div><div class="val">${fmtN(casesAuto)}</div>
            <div class="sub">Straight-through, evidence captured</div>
          </div>
          <div class="kpi-tile">
            <div class="lbl">Routed to human</div><div class="val">${fmtN(casesHuman)}</div>
            <div class="sub">Highest-judgement work only</div>
          </div>
          <div class="kpi-tile">
            <span class="trend down">▼ ${cycleReductionPct}%</span>
            <div class="lbl">Cycle time / case</div><div class="val">${demo.manual_hours}h → ${demo.auto_minutes}m</div>
            <div class="sub">Manual → agentic</div>
          </div>
          <div class="kpi-tile">
            <div class="lbl">Annual $ saving</div><div class="val">${fmt$(demo.annual_savings)}</div>
            <div class="sub">At run-rate</div>
          </div>
          <div class="kpi-tile">
            <div class="lbl">Risk reduction</div><div class="val">${demo.risk_reduction ? Math.round(demo.risk_reduction*100) : 0}%</div>
            <div class="sub">Loss-event probability</div>
          </div>
          <div class="kpi-tile">
            <div class="lbl">FTE-equivalents freed</div><div class="val">${fmtN(fteFreed)}</div>
            <div class="sub">≈ 1,800 hrs / FTE / yr</div>
          </div>
          <div class="kpi-tile">
            <div class="lbl">Cases / year</div><div class="val">${fmtN(demo.cases_per_year)}</div>
            <div class="sub">Demand pool</div>
          </div>
          <div class="kpi-tile">
            <div class="lbl">Value per case</div><div class="val">${fmt$(demo.value_per_case)}</div>
            <div class="sub">Avg avoided cost / case</div>
          </div>
        </div>
        <div class="kpi-callout">

    function renderTable(cols, rows) {
      const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
      const body = rows.map((r, i) => `
        <tr data-row-idx="${i}">
          ${r.map(v => {
            const isNum = typeof v === 'number';
            const cls = isNum ? 'num' : '';
            let disp = v;
            if (isNum && Math.abs(v) >= 1000) disp = v.toLocaleString();
            if (typeof v === 'boolean') disp = v ? '✓' : '–';
            return `<td class="${cls}">${esc(disp)}</td>`;
          }).join('')}
        </tr>
      `).join('');
      return `<table class="excel"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    // ---------------------------------------------------------------------
    // Demo binding (chat, viz mutations, agent run)
    // ---------------------------------------------------------------------
    let CURRENT_DEMO = null;
    function bindDemo(demo) {
      CURRENT_DEMO = demo;
      document.getElementById('back-link').onclick = () => nav('home');

      // Sheet tabs (switch to a different demo via the workbook tab strip)
      document.querySelectorAll('.sheet-tab').forEach(t => {
        t.onclick = () => nav('demo', t.dataset.goto);
      });

      // Suggested prompt chips
      document.querySelectorAll('.sp-chip').forEach(c => {
        c.onclick = () => {
          const p = demo.chat_prompts[Number(c.dataset.promptIdx)];
          if (p) sendChat(p.text, p);
        };
      });

      // Output-artifact tabs (KPIs / Workbook / Narrative / Questions)
      document.querySelectorAll('.art-tab').forEach(t => {
        t.onclick = () => switchArtifactTab(t.dataset.artTab);
      });

      // Additional-questions: clicking a question fires it into the chat
      document.querySelectorAll('.aq-item').forEach(it => {
        it.onclick = () => {
          const idx = Number(it.dataset.aqIdx);
          const q = (demo.further_questions || [])[idx];
          if (!q) return;
          const matched = matchPrompt(demo, q) || (demo.chat_prompts && demo.chat_prompts[0]);
          sendChat(q, matched);
          switchArtifactTab('workbook');
        };
      });

      // Chat input
      const inp = document.getElementById('chat-input');
      const send = document.getElementById('send-btn');
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter' && inp.value.trim()) { send.click(); }
      });
      send.onclick = () => {
        const text = inp.value.trim();
        if (!text) return;
        inp.value = '';
        const matched = matchPrompt(demo, text);
        sendChat(text, matched);
      };

      // Run agents
      document.getElementById('run-btn').onclick = () => runAgents(demo);
      document.getElementById('reset-btn').onclick = () => resetView(demo);
    }

    function matchPrompt(demo, text) {
      const t = text.toLowerCase();
      // First: try keyword match against canonical prompts
      let best = null;
      let bestScore = 0;
      for (const p of demo.chat_prompts) {
        const tokens = p.text.toLowerCase().split(/\W+/).filter(x => x.length > 3);
        let score = 0;
        for (const tok of tokens) if (t.includes(tok)) score++;
        if (score > bestScore) { bestScore = score; best = p; }
      }
      if (bestScore >= 2) return best;
      // Heuristic intents
      if (/\broi|saving|annual|value|case|automate/.test(t)) {
        return demo.chat_prompts.find(p => p.viz === 'roi_panel') || demo.chat_prompts[0];
      }
      if (/risk|high|alert|stuck|overdue|breach/.test(t)) {
        return demo.chat_prompts[0];
      }
      return null;
    }

    function appendMsg(who, html) {
      const body = document.getElementById('chat-body');
      const wrap = document.createElement('div');
      wrap.className = 'chat-msg ' + who;
      wrap.innerHTML = `<div class="msg-avatar">${who === 'bot' ? '⚡' : 'TP'}</div><div class="msg-bubble">${html}</div>`;
      body.appendChild(wrap);
      body.scrollTop = body.scrollHeight;
    }

    function showTyping() {
      const body = document.getElementById('chat-body');
      const wrap = document.createElement('div');
      wrap.className = 'chat-msg bot';
      wrap.id = 'typing-msg';
      wrap.innerHTML = `<div class="msg-avatar">⚡</div><div class="msg-bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
      body.appendChild(wrap);
      body.scrollTop = body.scrollHeight;
    }
    function hideTyping() {
      const m = document.getElementById('typing-msg');
      if (m) m.remove();
    }

    function sendChat(userText, matched) {
      appendMsg('user', esc(userText));
      showTyping();
      setTimeout(() => {
        hideTyping();
        if (matched) {
          appendMsg('bot', esc(matched.reply));
          revealArtifacts('workbook');
          applyViz(matched.viz, matched);
        } else {
          appendMsg('bot', `I can help with that. For this agent, try asking me about <b>which items to triage first</b>, <b>grouping by a dimension</b>, or the <b>ROI of automating a step</b>. I can also filter the workbook on the right.`);
        }
      }, 650);
    }

    // ---------------------------------------------------------------------
    // Output artifacts (KPIs / Metrics Workbook / Narrative / Questions)
    // ---------------------------------------------------------------------
    function revealArtifacts(focusTab) {
      const card = document.getElementById('artifacts-card');
      if (!card) return;
      card.classList.add('active');
      const badge = document.getElementById('artifacts-badge');
      if (badge) badge.textContent = 'Generated';

    }

    function switchArtifactTab(tabKey) {
      const tabs = document.querySelectorAll('.art-tab');
      const panes = document.querySelectorAll('.art-pane');
      tabs.forEach(t => t.classList.toggle('active', t.dataset.artTab === tabKey));
      panes.forEach(p => p.classList.toggle('active', p.dataset.artPane === tabKey));
    }

    // ---------------------------------------------------------------------
    // Visualization mutations triggered by chat
    // ---------------------------------------------------------------------
    function setVizStatus(text) {
      const el = document.getElementById('viz-status');
      if (text) { el.classList.add('active'); el.textContent = '🔍 ' + text; }
      else { el.classList.remove('active'); el.textContent = ''; }
    }
    function clearExtra() { document.getElementById('viz-extra').innerHTML = ''; }
    function setExtra(html) { document.getElementById('viz-extra').innerHTML = html; }

    function filterRows(predicate, statusText) {
      const tbody = document.querySelector('#table-wrap tbody');
      if (!tbody) return;
      const rows = tbody.querySelectorAll('tr');
      let visible = 0;
      const demo = CURRENT_DEMO;
      rows.forEach(tr => {
        const idx = Number(tr.dataset.rowIdx);
        const row = demo.rows[idx];
        const match = predicate(row, demo);
        if (match) { tr.classList.add('highlight'); tr.classList.remove('dim'); visible++; }
        else { tr.classList.remove('highlight'); tr.classList.add('dim'); }
      });
      setVizStatus(statusText + ` · ${visible} rows highlighted`);
    }

    function colIdx(name) {
      const cols = CURRENT_DEMO.data_columns;
      const i = cols.indexOf(name);
      return i;
    }

    function topRowsByScore(scoreFn, n) {
      const scored = CURRENT_DEMO.rows
        .map((r, i) => ({ i, r, s: scoreFn(r) }))
        .sort((a, b) => b.s - a.s)
        .slice(0, n);
      const set = new Set(scored.map(x => x.i));
      filterRows((r, d) => set.has(d.rows.indexOf(r)), 'Top ' + n + ' by score');
    }

    function barChart(title, items) {
      const max = Math.max(...items.map(i => i.value), 1);
      const rows = items.map(i => `
        <div class="bar-row">
          <div title="${esc(i.label)}">${esc(i.label)}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${(i.value/max*100).toFixed(1)}%"></div></div>
          <div class="bar-val">${esc(i.display ?? i.value)}</div>
        </div>
      `).join('');
      return `<div class="chart-box"><h4>${esc(title)}</h4><div class="bar-chart">${rows}</div></div>`;
    }

    function donutChart(title, slices) {
      const total = slices.reduce((a, s) => a + s.value, 0) || 1;
      const r = 50, cx = 60, cy = 60, c = 2 * Math.PI * r;
      let off = 0;
      const segs = slices.map(s => {
        const pct = s.value / total;
        const seg = `<circle r="${r}" cx="${cx}" cy="${cy}" fill="transparent" stroke="${s.color}" stroke-width="22"
          stroke-dasharray="${(pct*c).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
        off += pct * c;
        return seg;
      }).join('');
      const legend = slices.map(s =>
        `<span><span class="legend-dot" style="background:${s.color}"></span>${esc(s.label)} · ${Math.round(s.value/total*100)}%</span>`
      ).join('');
      return `<div class="chart-box"><h4>${esc(title)}</h4>
        <svg class="donut-svg" width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg)">${segs}</svg>
        <div class="donut-legend">${legend}</div>
      </div>`;
    }

    function waterfallChart(title, steps) {
      // simple bars centered around running total
      const rows = steps.map(s => {
        const w = Math.min(Math.abs(s.value) * 4, 200);
        const bg = s.value >= 0 ? '#107c10' : '#c50f1f';
        return `<div class="bar-row">
          <div>${esc(s.label)}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${w}px;background:${bg}"></div></div>
          <div class="bar-val">${(s.value >= 0 ? '+' : '') + s.value}pp</div>
        </div>`;
      }).join('');
      return `<div class="chart-box"><h4>${esc(title)}</h4><div class="bar-chart">${rows}</div></div>`;
    }

    function roiPanel() {
      const d = CURRENT_DEMO;
      return `<div class="chart-box"><h4>ROI panel — ${esc(d.title)}</h4>
        <div class="kpi-row">
          <div class="kpi"><div class="lbl">Manual hrs</div><div class="val">${d.manual_hours}</div></div>
          <div class="kpi"><div class="lbl">Agentic min</div><div class="val">${d.auto_minutes}</div></div>
          <div class="kpi"><div class="lbl">Risk red.</div><div class="val">${Math.round((d.risk_reduction||0)*100)}%</div></div>
          <div class="kpi"><div class="lbl">$ / case</div><div class="val">${fmt$(d.value_per_case)}</div></div>
          <div class="kpi"><div class="lbl">Annual $</div><div class="val">${fmt$(d.annual_savings)}</div></div>
        </div>
        ${barChart('Hours per case', [
          { label: 'Manual today', value: d.manual_hours, display: d.manual_hours + ' h' },

        ])}
