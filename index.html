    // Each viz key is mapped to a renderer. Where a viz isn't defined for a
    // specific demo, we fall back to a generic chart computed from the data.
    function applyViz(key, matched) {
      const d = CURRENT_DEMO;
      clearExtra();

      switch (key) {
        case 'roi_panel': setExtra(roiPanel()); setVizStatus('ROI panel updated'); return;

        case 'filter_stuck_deals': {
          const di = colIdx('Days_In_Queue'), pv = colIdx('Policy_Variance');
          filterRows(r => (r[di] || 0) > 5 && r[pv] && r[pv] !== 'None', 'Filter: >5 days in queue AND policy variance');
          setExtra(barChart('Days in queue · variance deals', bucket(d.rows.filter(r => (r[di] || 0) > 5 && r[pv] !== 'None'), r => bucketDays(r[di]))));
          return;
        }
        case 'industry_variance_bar': {
          const ii = colIdx('Industry'), pv = colIdx('Policy_Variance');
          const counts = countBy(d.rows.filter(r => r[pv] && r[pv] !== 'None'), r => r[ii]);
          setExtra(barChart('Policy variances by industry', topN(counts, 8)));
          return;
        }
        case 'top_alerts': {
          const rs = colIdx('Risk_Score'), sla = colIdx('SLA_Hours_Left');
          topRowsByScore(r => (r[rs] || 0) - (r[sla] || 0), 5);
          setExtra(barChart('Top 5 — risk × SLA pressure', d.rows
            .map((r, i) => ({ label: r[colIdx('Alert_ID')] || ('#' + i), value: (r[rs]||0) - (r[sla]||0), display: r[rs] + ' / ' + r[sla] + 'h' }))
            .sort((a,b) => b.value - a.value).slice(0,5)));
          return;
        }
        case 'typology_chart': {
          const ti = colIdx('Typology');
          const counts = countBy(d.rows, r => r[ti]);
          setExtra(barChart('Alerts by typology', topN(counts, 8)));
          return;
        }
        case 'false_positive_savings': {
          setExtra(`<div class="chart-box"><h4>False-positive auto-close savings</h4>
            <div class="kpi-row">
              <div class="kpi"><div class="lbl">Eligible alerts</div><div class="val">62%</div></div>
              <div class="kpi"><div class="lbl">FTE freed</div><div class="val">14</div></div>
              <div class="kpi"><div class="lbl">$ saving</div><div class="val">$41M</div></div>
            </div></div>`);
          return;
        }
        case 'overdue_high_risk': {
          const dao = colIdx('Days_Overdue'), rr = colIdx('Risk_Rating');
          filterRows(r => (r[dao] || 0) > 60 && /^High/.test(r[rr] || ''), 'Filter: >60 days overdue AND High+ risk');
          return;
        }
        case 'ownership_changes': {
          const oc = colIdx('Ownership_Change');
          filterRows(r => r[oc] === true, 'Customers with material ownership changes');
          return;
        }
        case 'lcr_breaches': {
          const bf = colIdx('Breach_Flag'), lcr = colIdx('LCR_Pct');
          filterRows(r => r[bf] === true || (r[lcr] || 0) < 100, 'Scenarios breaching LCR < 100%');
          return;
        }
        case 'variance_waterfall':
          setExtra(waterfallChart('LCR change vs last week (pp)', [
            { label: 'Rate sell-off', value: -4 },
            { label: 'Corporate outflow', value: -3 },
            { label: 'Deposit growth', value: +1 },
            { label: 'Net change', value: -6 }
          ]));
          return;
        case 'high_util_breaches': {
          const u = colIdx('Utilization_Pct');
          filterRows(r => (r[u] || 0) > 110, 'Breaches over 110% utilization');
          return;
        }
        case 'ttc_by_desk': {
          const dk = colIdx('Desk'), tc = colIdx('Time_To_Close_Min');
          const avg = groupAvg(d.rows, r => r[dk], r => r[tc]);
          setExtra(barChart('Avg time-to-close by desk (min)', topN(avg, 8, false)));
          return;
        }
        case 'weakest_controls': {
          const o = colIdx('Operating_Rating');
          filterRows(r => r[o] === 'Partial' || r[o] === 'Ineffective', 'Controls rated Partial or Ineffective');
          return;
        }
        case 'remediation_overdue': {
          const dtd = colIdx('Days_To_Due');
          filterRows(r => (r[dtd] || 0) < -30, 'Remediation overdue >30 days');
          return;
        }
        case 'critical_vendor_issues': {
          const c = colIdx('Criticality'), oi = colIdx('Open_Issues'), so = colIdx('SOC2_Status');
          filterRows(r => r[c] === 'Critical' && (((r[oi]||0) > 0) || (r[so] !== 'Clean')), 'Critical vendors with issues or SOC exceptions');
          return;
        }
        case 'renewals_90d': {
          const rd = colIdx('Renewal_Date');
          const inDays = (iso) => { try { return Math.ceil((new Date(iso) - new Date()) / (1000*60*60*24)); } catch (e) { return 9999; } };
          filterRows(r => inDays(r[rd]) >= 0 && inDays(r[rd]) <= 90, 'Renewals due in next 90 days');
          return;
        }
        case 'due_soon': {
          const dl = colIdx('Days_Left');
          filterRows(r => (r[dl] || 0) >= 0 && (r[dl] || 0) <= 7, 'Requests due in next 7 days');
          return;
        }
        case 'topic_heatmap': {
          const ti = colIdx('Topic');
          const counts = countBy(d.rows, r => r[ti]);
          setExtra(barChart('Requests by topic', topN(counts, 8)));
          return;
        }
        case 'overdue_models': {
          const nd = colIdx('Next_Due'), tier = colIdx('Tier');
          const overdue = (iso) => { try { return (new Date() - new Date(iso)) / (1000*60*60*24) > 0; } catch(e){ return false; }};
          filterRows(r => overdue(r[nd]), 'Models past Next_Due');
          // Tier-1 emphasis
          setExtra(barChart('Overdue models by Tier', topN(countBy(d.rows.filter(r => overdue(r[nd])), r => r[tier]), 5)));
          return;
        }
        case 'drift_models': {
          const pd = colIdx('Performance_Drift');
          filterRows(r => (r[pd] || 0) > 0.10, 'Models with drift >10%');
          return;
        }
        case 'recent_severity': {
          const sev = colIdx('Severity');
          filterRows(r => r[sev] === 'High' || r[sev] === 'Critical', 'High/Critical severity signals');
          return;
        }
        case 'topic_donut': {
          const ti = colIdx('Topic');
          const counts = countBy(d.rows, r => r[ti]);
          const top = topN(counts, 5);
          const palette = ['#5b5fc7', '#0078d4', '#117865', '#b07a07', '#c50f1f', '#605e5c'];
          setExtra(donutChart('Adverse signals by topic', top.map((t, i) => ({ label: t.label, value: t.value, color: palette[i % palette.length] }))));
          return;
        }
        default:
          setExtra(roiPanel());
          return;
      }
    }

    // helpers
    function countBy(arr, keyFn) {
      const m = new Map();
      for (const x of arr) {
        const k = keyFn(x); if (k == null) continue;
        m.set(k, (m.get(k) || 0) + 1);
      }
      return m;
    }
    function groupAvg(arr, keyFn, valFn) {
      const m = new Map();
      for (const x of arr) {
        const k = keyFn(x); const v = Number(valFn(x));
        if (k == null || !Number.isFinite(v)) continue;
        if (!m.has(k)) m.set(k, [0, 0]);
        const e = m.get(k); e[0] += v; e[1] += 1;
      }
      const out = new Map();
      for (const [k, [sum, n]] of m) out.set(k, Math.round(sum / n));
      return out;
    }
    function topN(map, n, isInt = true) {
      return [...map.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(([label, value]) => ({ label, value, display: isInt ? value : value.toFixed(0) }));
    }
    function bucketDays(d) {
      if (d == null) return 'unknown';
      if (d < 3) return '0–2 days';
      if (d < 7) return '3–6 days';
      if (d < 14) return '7–13 days';
      return '14+ days';
    }
    function bucket(rows, fn) {
      const c = countBy(rows, r => fn(r));
      return topN(c, 6);
    }

    // ---------------------------------------------------------------------
    // Run-agents animation
    // ---------------------------------------------------------------------
    function resetView(demo) {
      document.getElementById('agents-card').style.display = '';
      document.getElementById('exec-card').classList.remove('active');
      setVizStatus(null);
      clearExtra();
      document.querySelectorAll('#table-wrap tbody tr').forEach(tr => { tr.classList.remove('highlight','dim'); });
      const card = document.getElementById('artifacts-card');
      if (card) {
        card.classList.remove('active');
        const badge = document.getElementById('artifacts-badge');
        if (badge) badge.textContent = 'Ready';
        switchArtifactTab('kpis');
      }
    }
    function runAgents(demo) {
      // Hide the per-agent description card while agents are running (per spec).
      document.getElementById('agents-card').style.display = 'none';
      const exec = document.getElementById('exec-card');
      exec.classList.add('active');
      const pill = document.getElementById('exec-pill');
      pill.textContent = 'Running…'; pill.className = 'exec-pill running';

      const steps = demo.agents.map((a, i) => ({
        n: i + 1,
        text: stepText(demo, i),
        cot: (a.cot && a.cot.length ? a.cot : []),
      }));

      const list = document.getElementById('step-list');
      list.innerHTML = steps.map(s => {
        const cotMarkup = s.cot.map((line, idx) => {
          const isHandoff = idx === s.cot.length - 1;
          const cls = 'cot-line' + (isHandoff ? ' handoff' : '');
          const glyph = isHandoff ? '→' : '▸';
          return `<div class="${cls}" data-cot="${idx}"><span class="cot-glyph">${glyph}</span><span>${esc(line)}</span></div>`;
        }).join('');
        return `<div class="step" data-i="${s.n}">
          <div class="step-num">${s.n}</div>
          <div class="step-text">${esc(s.text)}</div>
          <div class="step-time"></div>
          <div class="step-cot">
            <div class="cot-typing">Reasoning over the data</div>
            ${cotMarkup}
          </div>
        </div>`;
      }).join('');

      // Pacing — slower than before so viewers can follow the chain of thought.
      const COT_LINE_DELAY = 900;     // ms between revealing each CoT line within a step
      const COT_START_DELAY = 650;    // ms after step starts before first CoT line appears
      const STEP_TAIL_DELAY = 900;    // ms after last CoT line before moving to next step
      const VIZ_DELAY = 1200;         // ms after step starts before the right-side viz mutates

      // Animate the steps; reveal CoT line-by-line, mutate the viz mid-step, then advance.
      let i = 0;
      function nextStep() {
        document.querySelectorAll('.step').forEach((el, idx) => {
          el.classList.toggle('running', idx === i);
        });
        const stepEl = document.querySelector(`.step[data-i="${i+1}"]`);
        const stepStart = performance.now();

        // Trigger the right-side viz mutation a beat after the step starts.
        setTimeout(() => applyRunStep(demo, i), VIZ_DELAY);

        const cotLines = stepEl ? [...stepEl.querySelectorAll('.cot-line')] : [];
        let lineIdx = 0;
        function revealNextLine() {
          if (lineIdx >= cotLines.length) {
            // All CoT lines shown — pause, then mark done and advance.
            setTimeout(() => {
              if (stepEl) {
                stepEl.classList.remove('running');
                stepEl.classList.add('done');
                const elapsed = Math.round(performance.now() - stepStart);
                stepEl.querySelector('.step-time').textContent = elapsed + ' ms';
              }
              i++;
              if (i < steps.length) nextStep();
              else {
                pill.textContent = 'Completed · ROI captured';
                pill.className = 'exec-pill done';
                setExtra(roiPanel());
                revealArtifacts('kpis');
              }
            }, STEP_TAIL_DELAY);
            return;
          }
          cotLines[lineIdx].classList.add('show');
          lineIdx++;
          setTimeout(revealNextLine, COT_LINE_DELAY);
        }
        setTimeout(revealNextLine, COT_START_DELAY);
      }
      nextStep();
    }

    function stepText(demo, i) {
      // No Microsoft product names in the live execution body — icons handle that.
      const purpose = demo.agents[i].purpose.split('.')[0];
      return `${demo.agents[i].name}: ${purpose}.`;
    }

    function applyRunStep(demo, i) {
      // Per-step side effect on the viz pane — keyed to the agent index so each step "does" something.
      const sequence = (CURRENT_DEMO.chat_prompts || []).slice(0, demo.agents.length);
      const fallback = ['roi_panel'];
      const key = (sequence[i] && sequence[i].viz) || fallback[i % fallback.length];
      // For run steps, prefer highlighting/filtering early and ROI at the end.
      if (i === demo.agents.length - 1) { applyViz('roi_panel', null); return; }
      // alternate filter and chart
      applyViz(key, sequence[i]);
    }

    // ---------------------------------------------------------------------
    // Boot
    // ---------------------------------------------------------------------
    (async function init() {
      await loadData();
      render();
    })();
  </script>

      "narrative": [
        "The model-validation agent flow processed 480 inventoried models this year, prioritising 142 Tier-1 and Tier-2 models due for periodic validation. The Inventory Agent reconciled the model inventory against actual production usage, flagging 18 unregistered models and 22 retired-but-still-running models.",
        "The Evidence Gathering Agent pulled model documentation, performance monitoring artefacts, calibration sets, sensitivity tests and prior validation reports \u2014 surfacing gaps for the SME to close. The Independent Testing Agent then re-ran the model on holdout data, executed sensitivity and stability checks, and produced the validation testing pack with model-rationale cited per finding.",
        "The Reporting & Issue Agent drafted the validation report, raised tier-appropriate findings with severity and remediation owner, and routed to the Model Risk Committee. Net effect: validation cycle fell from 60 days to 14 days, the bank cleared a 36-model SR-11/7 backlog and gained two letter grades in the most recent supervisory review of model risk management."
      ],
